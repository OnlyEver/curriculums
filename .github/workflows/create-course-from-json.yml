name: Create Course from JSON file

on:
  pull_request:
    types: [closed]
    branches:
      - main
  # Upserts one named file as it stands on main, without a curriculum merge.
  workflow_dispatch:
    inputs:
      file:
        description: "Path of ONE curriculum JSON file, e.g. praxis/math/CURRICULUM-PRAXIS-Core-Math.json"
        required: true
        type: string
      old_hash:
        description: "Optional. hash_code the course is stored under now (64 hex). Empty = the file's current hash. A value no course carries CREATES A DUPLICATE course."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  upsertCourse:
    runs-on: ubuntu-latest

    # Run if the PR was merged into main, or on a manual dispatch
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    env:
      # app-backend's youtube stack: customDomain api.theonlyever.com, basePath youtube,
      # httpApi route POST /create-course-from-json (serverless-youtube.yml)
      CREATE_COURSE_API: https://api.theonlyever.com/youtube/create-course-from-json

    steps:
      # Refuse before any request: a run without the key must not post headerless.
      - name: Require OE_SERVICE_KEY
        env:
          OE_SERVICE_KEY: ${{ secrets.OE_SERVICE_KEY }}
        run: |
          if [ -z "$OE_SERVICE_KEY" ]; then
            echo "::error::Repository secret OE_SERVICE_KEY is empty or not set. Refusing to post to $CREATE_COURSE_API without the x-oe-service-key header."
            exit 1
          fi

      # A manual run posts to production, so it takes only reviewed content.
      - name: Require main for manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual runs post to production and must run on main, not $GITHUB_REF."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # IMPORTANT for HEAD^ to work

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Process changed JSON files only and UPSERT
        env:
          OE_SERVICE_KEY: ${{ secrets.OE_SERVICE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          FILE_INPUT: ${{ inputs.file }}
          OLD_HASH_INPUT: ${{ inputs.old_hash }}
        run: |
          FAILED=0

          # POST one file to the API route. $1 file, $2 old hash, $3 new hash.
          post_course() {
            local FILE="$1" OLD_HASH="$2" NEW_HASH="$3"
            local COURSE_DATA
            COURSE_DATA=$(jq -c . "$FILE")

            if curl --fail-with-body -sS --max-time 60 -X POST "$CREATE_COURSE_API" \
              -H "Content-Type: application/json" \
              -H "x-oe-service-key: $OE_SERVICE_KEY" \
              -d "{
                \"course_data\": $COURSE_DATA,
                \"old_hash_code\": \"$OLD_HASH\",
                \"new_hash_code\": \"$NEW_HASH\",
                \"file_path\": \"$FILE\"
              }"; then
              echo
              echo "Request succeeded for $FILE"
            else
              echo
              echo "::error::Request failed for $FILE"
              FAILED=1
            fi
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run for: $FILE_INPUT"

            # Exactly one tracked file, as a repo-relative path (the form the merge path sends).
            if ! FILE=$(git --literal-pathspecs ls-files --error-unmatch --full-name -- "$FILE_INPUT"); then
              echo "::error::Not a tracked file on this ref: $FILE_INPUT"
              exit 1
            fi
            if [ "$(printf '%s\n' "$FILE" | wc -l)" -ne 1 ]; then
              echo "::error::Path must name exactly one file: $FILE_INPUT"
              exit 1
            fi

            case "$FILE" in
              *.json) ;;
              *) echo "::error::Not a .json path: $FILE"; exit 1 ;;
            esac
            if echo "$FILE" | grep -q -E '(^|/)curriculum_schema_.*\.json$'; then
              echo "::error::Schema files are not courses: $FILE"
              exit 1
            fi
            if [ ! -f "$FILE" ]; then
              echo "::error::No such file on this ref: $FILE"
              exit 1
            fi

            # The handler updates the course stored under old_hash, or creates one if
            # none is. Default old = new re-asserts the file as it stands.
            NEW_HASH=$(jq -c . "$FILE" | sha256sum | awk '{print $1}')
            OLD_HASH="${OLD_HASH_INPUT:-$NEW_HASH}"
            if ! echo "$OLD_HASH" | grep -q -x -E '[0-9a-f]{64}'; then
              echo "::error::old_hash must be 64 lowercase hex characters: $OLD_HASH"
              exit 1
            fi
            echo "Old hash: $OLD_HASH"
            echo "New hash: $NEW_HASH"
            post_course "$FILE" "$OLD_HASH" "$NEW_HASH"
            exit "$FAILED"
          fi

          echo "Detecting changed JSON files..."

          FILES=$(git diff --name-only HEAD^ HEAD \
            | grep '\.json$' \
            | grep -v -E '(^|/)curriculum_schema_.*\.json$' \
            || true)

          if [ -z "$FILES" ]; then
            echo "No JSON files changed (schema files ignored)."
            exit 0
          fi

          for FILE in $FILES; do
            echo "----------------------------------------"
            echo "Processing file: $FILE"

            # Old content (exists for modified or deleted files)
            OLD_CONTENT=$(git show HEAD^:"$FILE" 2>/dev/null || echo "{}")
            OLD_HASH=$(echo "$OLD_CONTENT" | jq -c . | sha256sum | awk '{print $1}')

            # Handle deleted files safely
            if [ ! -f "$FILE" ]; then
              echo "File was deleted: $FILE"
              echo "Old hash: $OLD_HASH"
              echo "Skipping deleted file."
              continue
            fi

            # New content exists
            NEW_HASH=$(jq -c . "$FILE" | sha256sum | awk '{print $1}')

            echo "Old hash: $OLD_HASH"
            echo "New hash: $NEW_HASH"

            if [ "$OLD_HASH" = "$NEW_HASH" ]; then
              echo "No changes detected. Skipping."
              continue
            fi

            post_course "$FILE" "$OLD_HASH" "$NEW_HASH"
          done

          exit "$FAILED"
