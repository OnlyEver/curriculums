name: "🐞 Bug report"
description: "Something is broken or behaving unexpectedly."
title: "<concise description of the bug>"
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        **Assign this to one person** (Assignees, right-hand sidebar) — its parent Mission's owner by default, though another owner is fine ([#512](https://github.com/OnlyEver/oe-devtools/issues/512));
        not two. The assignee is what tells the other person "this one isn't mine", which is the only
        thing stopping both of you starting it.
  - type: input
    id: app_version
    attributes:
      label: App / environment version
      description: App version, commit, or environment where the bug appears (leave blank if N/A).
    validations:
      required: false
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. Link the parent Mission (#) if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: To reproduce
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Observe the error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Exact error or wrong output
      description: Paste the error message, stack trace, log line or wrong output exactly, from a real run — not a paraphrase. Agents lose more from a missing error than from any other missing detail. Purely visual? Say what you saw and attach a screenshot below.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots and recordings
      description: Attach screenshots or screen recordings if applicable.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 1–3 testable criteria for "fixed" — usually the repro no longer fails, plus any unhappy path that must still work. These are the leaf's done-test and therefore Hari's — leave the DRAFT line until he has agreed them, then REPLACE it with a dated line recording his agreement (or recording that he wrote them himself). Never simply delete it; criteria carrying no line are treated as not agreed. End with the Out of scope line — what this issue will NOT do, or None; it is agreed with the criteria. See oe-devtools orchestration/github-workflow/body-contract.md, section Agreed criteria.
      value: |
        **DRAFT — not yet agreed with Hari.**

        - [ ] …

        **Out of scope:** …
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files to touch / files to avoid
      description: Where the fault probably lives, if known, and anything the fix must NOT touch. If you don't know, say so — it is filled in from the code before the issue is handed to a worker.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification step
      description: How will we confirm the fix? The command/test/observation that proves the bug is gone.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "### 👋 Complete before sending for QA (add a comment addressing each)"
  - type: textarea
    id: retro
    attributes:
      label: Root-cause retro
      description: Fill once the cause is known — this is how we stop the bug recurring.
      value: |
        - **Trigger:** what specifically caused the bug (misunderstood requirement, missing test, race condition, bad data assumption, etc.)
        - **Owner insight (1–2 lines):** who made the change and — briefly — why it went wrong.
        - **Prevention step:** one small process, check, or test we could add so similar bugs are less likely.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
        **The three sections below are the *living state*.** They start as stubs on purpose — nothing
        has been tried yet at creation time. Every later session rewrites them **in place**; the body
        is the state, the comments are the trail. See
        [github-workflow.md](https://github.com/OnlyEver/oe-devtools/blob/main/orchestration/github-workflow.md).
  - type: textarea
    id: current_approach
    attributes:
      label: Current approach
      description: One line — how we are solving this RIGHT NOW. Rewrite whenever it changes; a fresh session reads this first.
      value: |
        _Set at the first implementation session._
    validations:
      required: false
  - type: textarea
    id: status
    attributes:
      label: Status
      description: Reproduced? fix branch / PR? verified where? Rewritten each session — state, not a log.
      value: |
        _Not started._
    validations:
      required: false
  - type: textarea
    id: tried_rejected
    attributes:
      label: Tried & rejected (+ why)
      description: "Every abandoned approach and the ROOT CAUSE it failed, so no future session re-attempts a known dead end. The *why* is the load-bearing half. Never delete a row when rewriting the body."
      value: |
        | Approach | Why rejected |
        |---|---|
        | _None yet._ | |
    validations:
      required: false
