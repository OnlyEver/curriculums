name: "🧪 QA test issue"
description: "Track a round of QA testing against a build."
title: "QA - <date / build>"
type: "Task"
labels: ["🧐 QA"]
body:
  - type: markdown
    attributes:
      value: |
        **Assign this to its parent Mission's owner** (Assignees, right-hand sidebar) — one person,
        not two. The assignee is what tells the other person "this one isn't mine", which is the only
        thing stopping both of you starting it.
  - type: input
    id: build
    attributes:
      label: Build / test version
      description: APK / build / commit under test.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: A valid version is available for testing
        - label: This issue is parented to its Mission (leaf issues are not on a board)
        - label: This issue carries exactly one assignee — its parent Mission's owner
  - type: textarea
    id: tasks
    attributes:
      label: Tasks to test
      description: List the tasks under test. Add sub-items only while a task is in progress; if a task is done, list just the task.
      value: |
        - [ ] Task 1
            - [ ] Sub-item to test
    validations:
      required: true
