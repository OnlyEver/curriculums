name: "🤔 Spike / Resolve an unknown"
description: "A time-boxed investigation to resolve an unknown before building. Output is a decision, not code."
title: "Spike - <question>"
type: "Spike"
body:
  - type: markdown
    attributes:
      value: |
        **Assign this to one person** (Assignees, right-hand sidebar) — its parent Mission's owner by default, though another owner is fine ([#512](https://github.com/OnlyEver/oe-devtools/issues/512));
        not two. The assignee is what tells the other person "this one isn't mine", which is the only
        thing stopping both of you starting it.
  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
      description: Why is this question important? How does it impact direction, architecture, or UX?
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The question
      description: The specific unknown to resolve, phrased so the answer is checkable.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      description: How much effort before we stop and decide with what we have (e.g. "2 hours", "1 day").
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output — the decision / answer
      description: Fill when the spike closes. The conclusion + what we'll do about it. This is the deliverable.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
        **The three sections below are the *living state*.** They start as stubs on purpose — nothing
        has been tried yet at creation time. Every later session rewrites them **in place**; the body
        is the state, the comments are the trail. See
        [github-workflow.md](https://github.com/OnlyEver/oe-devtools/blob/main/orchestration/github-workflow.md).
  - type: textarea
    id: current_approach
    attributes:
      label: Current approach
      description: One line — how we are solving this RIGHT NOW. Rewrite whenever it changes; a fresh session reads this first.
      value: |
        _Set at the first implementation session._
    validations:
      required: false
  - type: textarea
    id: status
    attributes:
      label: Status
      description: What has been investigated so far and what is left inside the timebox.
      value: |
        _Not started._
    validations:
      required: false
  - type: textarea
    id: tried_rejected
    attributes:
      label: Tried & rejected (+ why)
      description: "Every abandoned approach and the ROOT CAUSE it failed, so no future session re-attempts a known dead end. The *why* is the load-bearing half. Never delete a row when rewriting the body."
      value: |
        | Approach | Why rejected |
        |---|---|
        | _None yet._ | |
    validations:
      required: false
