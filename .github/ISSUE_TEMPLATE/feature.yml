name: "🧩 Feature / User story"
description: "A user-facing feature or user story (a unit of value within a mission)."
title: "<Do this> to allow/help <learner/creator/dev team> to <goal/benefit>"
type: "Feature"
assignees: ["puzhu"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it agent-executable: a fresh Claude session should be able to pick this up and finish it
        without asking you questions. Fill every required field below.
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: What and why, in a few sentences. Link the parent mission (#) if there is one.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 1–3 testable criteria (Given/When/Then or a checklist). 4+ means split this into multiple issues.
      value: |
        - [ ] Given … when … then …
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files to touch / files to avoid
      description: Point the agent at the right code. Name files/dirs to change and any it must NOT touch.
      placeholder: |
        Touch: lib/foo.dart, lib/widgets/bar.dart
        Avoid: anything under lib/legacy/ ; do not change the DB schema
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification step
      description: The exact command/test/observation that proves it's done, so the agent can self-verify and close the loop.
      placeholder: "flutter test test/foo_test.dart ; manually: open X, expect Y"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        **The three sections below are the *living state*.** They start as stubs on purpose — nothing
        has been tried yet at creation time. Every later session rewrites them **in place**; the body
        is the state, the comments are the trail. See
        [github-workflow.md](https://github.com/OnlyEver/oe-devtools/blob/main/orchestration/github-workflow.md).
  - type: textarea
    id: current_approach
    attributes:
      label: Current approach
      description: One line — how we are solving this RIGHT NOW. Rewrite whenever it changes; a fresh session reads this first.
      value: |
        _Set at the first implementation session._
    validations:
      required: false
  - type: textarea
    id: status
    attributes:
      label: Status
      description: Branch / PR / commit and what is in flight. Rewritten each session — state, not a log.
      value: |
        _Not started._
    validations:
      required: false
  - type: textarea
    id: tried_rejected
    attributes:
      label: Tried & rejected (+ why)
      description: "Every abandoned approach and the ROOT CAUSE it failed, so no future session re-attempts a known dead end. The *why* is the load-bearing half. Never delete a row when rewriting the body."
      value: |
        | Approach | Why rejected |
        |---|---|
        | _None yet._ | |
    validations:
      required: false
