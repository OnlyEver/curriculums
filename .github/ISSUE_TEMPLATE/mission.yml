name: "🏔️ Mission"
description: "A large feature build or collection of related work. Parent of stories/tasks."
title: "Mission - <title>"
type: "Mission"
labels: ["⛰️ Mission Spec"]
projects: ["OnlyEver/8"]
body:
  - type: markdown
    attributes:
      value: |
        **Assign this Mission to exactly one person** (Assignees, right-hand sidebar). There is no
        default: every sub-issue cut from it inherits that one assignee, so an unowned Mission
        propagates an unowned stream.
  - type: markdown
    attributes:
      value: |
        A mission groups related stories/tasks behind one outcome. After creating it, add the
        child work as **sub-issues** (Issue → "Create sub-issue" or `gh issue create --parent <n>`),
        not a flat checklist — sub-issues drive the board's progress bar and roll up automatically.
  - type: textarea
    id: brief
    attributes:
      label: The Mission Brief
      description: What do you want to do? One or two sentences max.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why do this? How does it help users learn more effectively? What future opportunities does it create?
    validations:
      required: true
  - type: textarea
    id: mvv
    attributes:
      label: Minimum Viable Version (MVV)
      description: >-
        The first shippable version good enough to validate the core value prop. THIS IS THE
        DONE-TEST — a Mission closes when every bullet here is ticked AND carries a verification
        note written by someone who did not do the work, not when the sub-issue queue empties.
        Make each bullet checkable: numbers over adjectives.
      value: |
        - [ ] Requirement 1
    validations:
      required: true

  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: >-
        Anything the MVV bullets do not already say — typically an end-to-end check proving the
        outcome holds in the running system rather than in the diff. Leave the default if the MVV
        covers it. (Added 2026-08-25, oe-devtools#499: the form had no field for this while the
        body skeleton did, so form-created Missions were born with no done-condition at all.)
      value: |
        Every MVV bullet above is ticked and verified.
    validations:
      required: false
  - type: textarea
    id: noted_not_doing
    attributes:
      label: Noted, not doing
      description: >-
        Facts found while working that are true, ours, and NOT being acted on. Not a backlog —
        nothing here is work and nothing here moves the Done-when test. A leaf is filed only when a
        fact BLOCKS an MVV bullet. (Added 2026-08-25, oe-devtools#499: github-workflow.md makes this
        the mandatory destination for a non-blocking mid-work discovery, so a Mission born without
        the section leaves a session filing a leaf instead — the exact behaviour the rule prevents.)
      value: |
        - _None yet._
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope (for now)
      description: What this mission explicitly will NOT do — keeps agents and stories bounded.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
        **The three sections below are the *living state*.** They start as stubs on purpose — nothing
        has been tried yet at creation time. Every later session rewrites them **in place**; the body
        is the state, the comments are the trail. See
        [github-workflow.md](https://github.com/OnlyEver/oe-devtools/blob/main/orchestration/github-workflow.md).
  - type: textarea
    id: current_approach
    attributes:
      label: Current approach
      description: One line — how we are solving this RIGHT NOW. Rewrite whenever it changes; a fresh session reads this first.
      value: |
        _Set at the first implementation session._
    validations:
      required: false
  - type: textarea
    id: status
    attributes:
      label: Status / sub-issues
      description: Which sub-issues are open, closed, or not yet cut. Rewritten each session — state, not a log.
      value: |
        _Not started._
    validations:
      required: false
  - type: textarea
    id: tried_rejected
    attributes:
      label: Tried & rejected (+ why)
      description: "Every abandoned approach and the ROOT CAUSE it failed, so no future session re-attempts a known dead end. The *why* is the load-bearing half. Never delete a row when rewriting the body."
      value: |
        | Approach | Why rejected |
        |---|---|
        | _None yet._ | |
    validations:
      required: false
