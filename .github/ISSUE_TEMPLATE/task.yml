name: "🛠️ Task"
description: "A concrete piece of work that isn't a user-facing feature (refactor, infra, chore, integration)."
title: "<concise, action-oriented title>"
type: "Task"
body:
  - type: markdown
    attributes:
      value: |
        **Assign this to its parent Mission's owner** (Assignees, right-hand sidebar) — one person,
        not two. The assignee is what tells the other person "this one isn't mine", which is the only
        thing stopping both of you starting it.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What and why. Link the parent mission/feature (#) if there is one.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 1–3 testable criteria. 4+ means split this.
      value: |
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files to touch / files to avoid
      description: Name files/dirs to change and any the agent must NOT touch.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification step
      description: The command/test/observation that proves it's done.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        **The three sections below are the *living state*.** They start as stubs on purpose — nothing
        has been tried yet at creation time. Every later session rewrites them **in place**; the body
        is the state, the comments are the trail. See
        [github-workflow.md](https://github.com/OnlyEver/oe-devtools/blob/main/orchestration/github-workflow.md).
  - type: textarea
    id: current_approach
    attributes:
      label: Current approach
      description: One line — how we are solving this RIGHT NOW. Rewrite whenever it changes; a fresh session reads this first.
      value: |
        _Set at the first implementation session._
    validations:
      required: false
  - type: textarea
    id: status
    attributes:
      label: Status
      description: Branch / PR / commit and what is in flight. Rewritten each session — state, not a log.
      value: |
        _Not started._
    validations:
      required: false
  - type: textarea
    id: tried_rejected
    attributes:
      label: Tried & rejected (+ why)
      description: "Every abandoned approach and the ROOT CAUSE it failed, so no future session re-attempts a known dead end. The *why* is the load-bearing half. Never delete a row when rewriting the body."
      value: |
        | Approach | Why rejected |
        |---|---|
        | _None yet._ | |
    validations:
      required: false
